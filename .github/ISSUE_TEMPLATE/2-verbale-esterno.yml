name: Verbale esterno
description: Stesura del verbale di una riunione con il proponente o con un'altra azienda.
title: "docs(minutes): verbale esterno con <azienda> del AAAA-MM-GG"
labels: ["verbale esterno"]
body:
  - type: markdown
    attributes:
      value: |
        Una issue = **una persona** e **una scadenza**. Assegnala al redattore e imposta la milestone.
        Il verbale esterno va firmato dall'azienda. La PR del verbale si integra con l'approvazione del Verificatore e cita questa issue solo con `Refs #n`. Poi il Responsabile rilascia il verbale (versione 1.0.0) e lo invia all'azienda per la firma. Il PDF firmato arriva con una seconda PR, che chiude questa issue (`Closes #n`). Il sito pubblica il verbale solo quando c'è la versione `*-signed.pdf`.

  - type: input
    id: riunione
    attributes:
      label: Riunione
      description: L'azienda e la data della riunione, in formato AAAA-MM-GG.
      placeholder: "Riunione con <azienda> del AAAA-MM-GG"
    validations:
      required: true

  - type: input
    id: output
    attributes:
      label: Output atteso
      placeholder: "RTB/Verbali_esterni/AAAA-MM-GG-<azienda>.typ"
    validations:
      required: true

  - type: input
    id: scadenza
    attributes:
      label: Scadenza
      description: Formato AAAA-MM-GG. È la data entro cui inviare il verbale all'azienda per la firma.
      placeholder: "AAAA-MM-GG"
    validations:
      required: true

  - type: dropdown
    id: ruolo
    attributes:
      label: Ruolo
      description: Il ruolo con cui il redattore svolge l'attività (serve per il consuntivo delle ore).
      options:
        - Responsabile
        - Amministratore
        - Analista
        - Progettista
        - Programmatore
        - Verificatore
    validations:
      required: true

  - type: input
    id: stima
    attributes:
      label: Stima delle ore
      placeholder: "es. 2"
    validations:
      required: true

  - type: input
    id: verificatore
    attributes:
      label: Verificatore
      description: Menzionalo, così riceve la notifica. Deve essere una persona diversa dal redattore.
      placeholder: "@nome"
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Aggiungi i criteri specifici di questa riunione, se ce ne sono. Le voci le spunta l'assegnatario.
      value: |
        _Le voci le spunta l'assegnatario, man mano che le completa. Quando sono tutte spuntate, avvisa il verificatore._

        - [ ] Verbale redatto con il template `Templates/Verbali.typ`, con il campo `azienda` compilato
        - [ ] La PR ha la label `minor` o `patch` e la sezione *Registro delle modifiche* compilata; versione, stato e registro (`<nome>.yml`) non sono modificati a mano
        - [ ] Per ogni azione decisa esiste la sua issue, e il numero è nella colonna Issue
        - [ ] La PR del verbale cita questa issue e le issue delle azioni solo con `Refs #n`, ed è integrata dopo l'approvazione del Verificatore
        - [ ] Il Responsabile ha rilasciato il verbale (versione 1.0.0) e ha inviato all'azienda, per la firma, il PDF di quella versione
        - [ ] Il PDF firmato è caricato accanto al sorgente come `*-signed.pdf`, con una seconda PR che chiude questa issue (`Closes #n`)
    validations:
      required: true

  - type: textarea
    id: verifica
    attributes:
      label: Verifica
      description: Checklist per i verbali esterni. La compila il verificatore, che non modifica il verbale ma lascia commenti.
      value: |
        _Le voci le spunta solo il verificatore. Se una voce della Definition of Done non è vera, non la toglie: segna «Da correggere» e lascia un commento._

        - [ ] La Definition of Done è soddisfatta
        - [ ] Il primo punto è l'ordine del giorno; data, ora e partecipanti (del gruppo e dell'azienda) sono presenti
        - [ ] Ogni decisione è motivata
        - [ ] Ogni azione ha una sola persona, una scadenza in AAAA-MM-GG, la decisione di riferimento e la sua issue
        - [ ] Non ci sono «Tutti», «da definire» o `N/D`
        - [ ] Le issue citate esistono e corrispondono alle azioni (assegnatario e scadenza coincidono)
        - [ ] Tutte le date sono nel formato AAAA-MM-GG
        - [ ] Registro delle modifiche: la sezione della PR descrive la modifica in modo chiaro; la verifica non modifica il documento né il suo `<nome>.yml`
        - [ ] Versionamento: la label è adatta alla modifica (`patch` per una correzione minore, `minor` per un aggiornamento sostanziale); la versione la calcola l'automazione dopo il merge
        - [ ] Il verbale compila senza errori (CI verde)
        - [ ] Il PDF firmato corrisponde alla versione 1.0.0 rilasciata dal Responsabile
        - [ ] La PR del verbale non chiude nessuna issue; questa issue la chiude solo la PR del PDF firmato

        **Esito** (spuntane uno):
        - [ ] ✅ Accettato
        - [ ] 💬 Da correggere (vedi commenti)
        - [ ] ❌ Rifiutato

  - type: textarea
    id: note
    attributes:
      label: Note e dipendenze
