name: Compila PDF

on:
  push:
    branches: [main]
    paths:
      - "**.typ"
      - "Templates/**"
      - "Scripts/compila.sh"
      - ".github/workflows/compila-pdf.yml"
      - ".github/workflows/compila-comune.yml"
  workflow_dispatch: # permette di avviarlo a mano dalla scheda Actions

# Evita che due esecuzioni ravvicinate si sovrappongano
concurrency:
  group: compila-pdf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compila:
    uses: ./.github/workflows/compila-comune.yml
    with:
      nome-artifact: pdf