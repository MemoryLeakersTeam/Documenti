name: Verbale interno
description: Stesura del verbale di una riunione interna del gruppo.
title: "docs(minutes): verbale interno del AAAA-MM-GG"
labels: ["verbale interno"]
body:
  - type: markdown
    attributes:
      value: |
        Una issue = **una persona** e **una scadenza**. Assegnala al redattore e imposta la milestone.
        Per una riunione con un'azienda usa il modulo **Verbale esterno**.

  - type: input
    id: riunione
    attributes:
      label: Riunione
      description: La riunione da verbalizzare, con data in formato AAAA-MM-GG.
      placeholder: "Riunione interna del AAAA-MM-GG"
    validations:
      required: true

  - type: input
    id: output
    attributes:
      label: Output atteso
      placeholder: "RTB/Verbali_interni/AAAA-MM-GG.typ"
    validations:
      required: true

  - type: input
    id: scadenza
    attributes:
      label: Scadenza
      description: Formato AAAA-MM-GG.
      placeholder: "AAAA-MM-GG"
    validations:
      required: true

  - type: dropdown
    id: ruolo
    attributes:
      label: Ruolo
      description: Il ruolo con cui il redattore svolge l'attività (serve per il consuntivo delle ore).
      options:
        - Responsabile
        - Amministratore
        - Analista
        - Progettista
        - Programmatore
        - Verificatore
    validations:
      required: true

  - type: input
    id: stima
    attributes:
      label: Stima delle ore
      placeholder: "es. 2"
    validations:
      required: true

  - type: input
    id: verificatore
    attributes:
      label: Verificatore
      description: Menzionalo, così riceve la notifica. Deve essere una persona diversa dal redattore.
      placeholder: "@nome"
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Aggiungi i criteri specifici di questa riunione, se ce ne sono. Le voci le spunta l'assegnatario.
      value: |
        _Le voci le spunta l'assegnatario, man mano che le completa. Quando sono tutte spuntate, avvisa il verificatore._

        - [ ] Verbale redatto con il template `Templates/Verbali.typ`
        - [ ] Per ogni azione decisa esiste la sua issue, e il numero è nella colonna Issue
        - [ ] La PR chiude solo questa issue (`Closes #n`); le issue delle azioni sono citate con `Refs #n`
    validations:
      required: true

  - type: textarea
    id: verifica
    attributes:
      label: Verifica
      description: Checklist per i verbali interni. La compila il verificatore, che non modifica il verbale ma lascia commenti.
      value: |
        _Le voci le spunta solo il verificatore. Se una voce della Definition of Done non è vera, non la toglie: segna «Da correggere» e lascia un commento._

        - [ ] La Definition of Done è soddisfatta
        - [ ] Il primo punto è l'ordine del giorno; data, ora e partecipanti sono presenti
        - [ ] Ogni decisione è motivata
        - [ ] Ogni azione ha una sola persona, una scadenza in AAAA-MM-GG, la decisione di riferimento e la sua issue
        - [ ] Non ci sono «Tutti», «da definire» o `N/D`
        - [ ] Le issue citate esistono e corrispondono alle azioni (assegnatario e scadenza coincidono)
        - [ ] Tutte le date sono nel formato AAAA-MM-GG
        - [ ] Registro delle modifiche: una riga per modifica, con un solo autore; la verifica non aggiunge righe
        - [ ] Il verbale compila senza errori (CI verde)
        - [ ] La PR chiude solo questa issue (`Closes #n`) e non chiude le issue delle azioni

        **Esito** (spuntane uno):
        - [ ] ✅ Accettato
        - [ ] 💬 Da correggere (vedi commenti)
        - [ ] ❌ Rifiutato

  - type: textarea
    id: note
    attributes:
      label: Note e dipendenze
